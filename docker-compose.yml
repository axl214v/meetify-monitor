services:
  monitor:
    build: .
    container_name: meetify-monitor
    restart: unless-stopped
    # Built-in HTTPS (DOMAIN set): publish 80/443 on the host by setting
    # TLS_BIND=0.0.0.0, HTTP_PORT=80, HTTPS_PORT=443. By default they stay on
    # loopback high ports so they never clash with an existing proxy.
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8080}:8080"
      - "${TLS_BIND:-127.0.0.1}:${HTTP_PORT:-8082}:80"
      - "${TLS_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - monitor-data:/app/data
    env_file: .env
    environment:
      - DB_PATH=/app/data/monitor.db

volumes:
  monitor-data:
